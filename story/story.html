<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Cumartesi Story Şablonu</title>
<link rel="stylesheet" href="fonts.css">
<style>
  :root{
    --paper:#F3F0E8;      /* kırık beyaz */
    --paper-2:#ECE8DD;
    --ink:#1D201E;        /* koyu antrasit */
    --ink-soft:#4A4F4B;
    --muted:#7D827C;
    --green-deep:#2E4A3B; /* kurumsal koyu yeşil */
    --green:#55735F;      /* ana yeşil */
    --sage:#9FB5A1;       /* yumuşak adaçayı */
    --mist:#D9E2D6;       /* açık yeşil sis */
    --rule:rgba(29,32,30,.14);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:var(--paper)}
  body{font-family:'Manrope',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;font-kerning:normal}
  .story{position:relative;width:1080px;height:1920px;overflow:hidden;
    background:
      radial-gradient(900px 760px at 100% 38%, rgba(159,181,161,.34), transparent 70%),
      radial-gradient(760px 620px at -8% 92%, rgba(85,115,95,.16), transparent 70%),
      linear-gradient(180deg, var(--paper) 0%, var(--paper-2) 100%);
  }
  .grain{position:absolute;inset:0;opacity:.35;mix-blend-mode:multiply;pointer-events:none}
  .art{position:absolute;inset:0;pointer-events:none}

  /* İçerik: Instagram güvenli alanı ~ üst 250px, alt 340px, yan 90px */
  .content{position:absolute;left:96px;right:96px;top:250px;bottom:0}

  /* ÜST */
  .eyebrow{display:flex;align-items:center;gap:22px;
    font-weight:600;font-size:22px;letter-spacing:.42em;color:var(--green);text-transform:uppercase}
  .eyebrow::before{content:"";width:56px;height:2px;background:var(--green)}
  .name{margin-top:26px;font-weight:700;font-size:70px;line-height:1;letter-spacing:.04em;color:var(--ink)}
  .fields{margin-top:30px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 0;
    font-weight:400;font-size:25px;letter-spacing:.06em;color:var(--ink-soft)}
  .fields span{display:inline-flex;align-items:center}
  .fields span+span::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--sage);margin:0 18px}

  /* ORTA */
  .hero{position:absolute;top:335px;left:0;right:0}
  .headline{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:114px;line-height:1.0;letter-spacing:-.012em;color:var(--ink)}
  .headline em{display:block;font-style:italic;font-weight:400;color:var(--green-deep)}
  .sub{margin-top:48px;display:flex;gap:26px;align-items:flex-start}
  .sub::before{content:"";flex:none;width:2px;height:78px;margin-top:6px;background:linear-gradient(var(--green),rgba(85,115,95,0))}
  .sub p{font-weight:400;font-size:32px;line-height:1.42;color:var(--ink-soft)}

  /* ALT */
  .info{position:absolute;top:765px;left:0;right:0}
  .rule{height:1px;background:var(--rule)}
  .grid{display:grid;grid-template-columns:1.12fr 1fr;column-gap:56px}
  .block{padding:34px 0 32px}
  .label{display:flex;align-items:center;gap:12px;font-weight:600;font-size:19px;letter-spacing:.32em;text-transform:uppercase;color:var(--green)}
  .label svg{width:22px;height:22px;flex:none}
  .val{margin-top:16px;font-size:33px;line-height:1.36;color:var(--ink);font-weight:500}
  .val small{display:block;font-size:27px;font-weight:400;color:var(--ink-soft);letter-spacing:.01em}
  .hours{margin-top:16px;display:grid;grid-template-columns:1fr;row-gap:4px}
  .hours dt{font-size:24px;color:var(--ink-soft);font-weight:400;letter-spacing:.01em}
  .hours dd{font-size:31px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.01em;white-space:nowrap}
  .hours dd + dt{margin-top:14px}
  .vline{border-left:1px solid var(--rule);padding-left:56px}
  .ig{display:flex;align-items:center;justify-content:space-between;padding:30px 0}
  .ig .handle{display:flex;align-items:center;gap:18px;font-size:31px;font-weight:600;color:var(--ink);letter-spacing:.01em}
  .ig .handle svg{width:34px;height:34px}
  .ig .note{font-size:22px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);font-weight:500}

  /* Bağlantı çıkartması için boş alan (yalnızca kılavuz modunda görünür) */
  .link-zone{position:absolute;left:96px;right:96px;top:1395px;height:165px;border-radius:28px}
  .guides .link-zone{outline:3px dashed rgba(200,60,60,.55);background:rgba(200,60,60,.05)}
  .guides .safe{position:absolute;left:0;right:0;background:rgba(200,60,60,.10);border:2px dashed rgba(200,60,60,.6)}
  .safe{display:none}
  .guides .safe{display:block}
</style>
</head>
<body>
<div class="story" id="story">

  <!-- Arka plan: soyut omurga / beden çizgileri -->
  <svg class="art" viewBox="0 0 1080 1920" aria-hidden="true">
    <defs>
      <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#55735F" stop-opacity="0"/>
        <stop offset=".22" stop-color="#55735F" stop-opacity=".38"/>
        <stop offset=".78" stop-color="#55735F" stop-opacity=".38"/>
        <stop offset="1" stop-color="#55735F" stop-opacity="0"/>
      </linearGradient>
      <radialGradient id="orb" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#9FB5A1" stop-opacity=".55"/>
        <stop offset="1" stop-color="#9FB5A1" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- yumuşak organik form -->
    <circle cx="930" cy="640" r="400" fill="url(#orb)"/>

    <!-- beden silüetini çağrıştıran akış çizgileri -->
    <g fill="none" stroke="url(#fade)" stroke-width="1.6" stroke-linecap="round">
      <path d="M1150 160 C 930 340, 1080 520, 930 680 S 860 900, 1000 1040 S 1110 1180, 1100 1260"/>
      <path d="M1185 175 C 965 355, 1115 535, 965 695 S 895 915, 1035 1055 S 1145 1195, 1135 1275" opacity=".6"/>
    </g>

    <!-- omurga: S eğrisi boyunca minimal omur dizisi -->
    <g id="spine" fill="none" stroke="#2E4A3B" stroke-opacity=".20" stroke-width="2"></g>
  </svg>

  <!-- ince doku -->
  <svg class="grain" width="1080" height="1920" aria-hidden="true">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .3  0 0 0 0 .32  0 0 0 0 .3  0 0 0 .09 0"/></filter>
    <rect width="100%" height="100%" filter="url(#n)"/>
  </svg>

  <div class="safe" style="top:0;height:250px"></div>
  <div class="link-zone"></div>
  <div class="safe" style="bottom:0;height:340px"></div>

  <div class="content">
    <!-- ÜST -->
    <header>
      <div class="eyebrow">Fizyoterapist</div>
      <h1 class="name">ALPARSLAN ERİŞTİ</h1>
      <div class="fields">
        <span>Osteopati</span><span>Manuel Terapi</span><span>Psikonöroimmünoloji</span><span>Klinik Pilates</span>
      </div>
    </header>

    <!-- ORTA -->
    <section class="hero">
      <h2 class="headline">Yeni bir hafta,<em>kendine zaman ayır.</em></h2>
      <div class="sub"><p>Önümüzdeki hafta için<br>randevu ve iletişim bilgileri.</p></div>
    </section>

    <!-- ALT -->
    <section class="info">
      <div class="rule"></div>
      <div class="grid">
        <div class="block">
          <div class="label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/></svg>
            Ayvalık
          </div>
          <div class="val">No 456 İş Merkezi<small>D:27</small></div>
        </div>
        <div class="block vline">
          <div class="label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>
            Çalışma Saatleri
          </div>
          <dl class="hours">
            <dt>Pazartesi – Cuma</dt><dd>09.00–19.00</dd>
            <dt>Cumartesi</dt><dd>13.00–19.00</dd>
          </dl>
        </div>
      </div>
      <div class="rule"></div>
      <div class="ig">
        <div class="handle">
          <svg viewBox="0 0 24 24" fill="none" stroke="#2E4A3B" stroke-width="1.7"><rect x="3.2" y="3.2" width="17.6" height="17.6" rx="5.2"/><circle cx="12" cy="12" r="4.1"/><circle cx="17.3" cy="6.7" r="1" fill="#2E4A3B" stroke="none"/></svg>
          @fzt.alparslaneristi
        </div>
      </div>
    </section>
  </div>
</div>

<script>
  // Omurga dizisi: bir S eğrisi boyunca küçük, yatay yuvarlatılmış omurlar
  (function(){
    const g=document.getElementById('spine');
    const ns='http://www.w3.org/2000/svg';
    const N=17, y0=290, y1=760;
    for(let i=0;i<N;i++){
      const t=i/(N-1);
      const y=y0+(y1-y0)*t;
      const x=985+Math.sin(t*Math.PI*1.4+0.5)*26;
      const w=26+Math.sin(t*Math.PI)*18;           // ortada daha geniş
      const h=10+Math.sin(t*Math.PI)*4;
      const r=document.createElementNS(ns,'rect');
      r.setAttribute('x',(x-w/2).toFixed(1)); r.setAttribute('y',(y-h/2).toFixed(1));
      r.setAttribute('width',w.toFixed(1)); r.setAttribute('height',h.toFixed(1));
      r.setAttribute('rx',(h/2).toFixed(1));
      const op=Math.sin(t*Math.PI); r.setAttribute('stroke-opacity',(0.02+op*0.13).toFixed(3));
      g.appendChild(r);
    }
    if(location.search.includes('guides')) document.body.classList.add('guides');
  })();
</script>
</body>
</html>
