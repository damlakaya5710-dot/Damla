/* ---------------- arka plan: krem zemin + adaçayı yeşili kavisler (ekran uzayında) ---------------- */
const bgU = { uT: { value: 0 } };
{

    uniforms: bgU, depthTest: false, depthWrite: false,
    vertexShader: `varying vec2 vU; void main(){ vU=uv; gl_Position=vec4(position.xy,.9999,1.); }`,

}
const dust = (() => {

  const g = new THREE.BufferGeometry();

    vertexShader: `attribute float ph; uniform float uT; varying float vA;

    fragmentShader: `uniform float uA; varying float vA; void main(){ float d=length(gl_PointCoord-.5);

/* =====================================================================

      Her kas bir SDF şeklidir (elipsoid / yuvarlatılmış koni); yumuşak
      birleşimle kaynaşır, "surface nets" ile tek bir ağ (mesh) üretilir.
      Her köşe, ait olduğu kasın lif yönünü ve kaslar arası oluk bilgisini taşır.

      WR = [V(.285, .86, .03), V(-.285, .86, .03)], HP = [V(.095, .9, -.02), V(-.095, .9, -.02)],

  const ex = new THREE.Vector3().crossVectors(ey, ref).normalize(); const ez = new THREE.Vector3().crossVectors(ex, ey);
  return [ex, ey, ez];
}

  const [ex, ey, ez] = basis(ax);

}

const M = (v, s) => V(v.x * s, v.y, v.z);
// gövde çekirdeği

E(V(0, 1.06, -.005), V(.125, .13, .085), V(0, 1, 0), .04);
E(V(0, .94, -.025), V(.152, .09, .1), V(0, 1, 0), .05, V(1, 0, 0));

E(V(0, 1.705, -.012), V(.077, .098, .094), V(0, 1, 0), .03, V(0, 0, 1));                  // kafatası
E(V(0, 1.635, .035), V(.057, .066, .062), V(0, 1, 0), .03);                               // yüz

  C(M(V(.05, 1.44, .045), s), M(V(.044, 1.625, -.035), s), .016, .014, .015);               // sternokleidomastoid
  E(M(V(.035, 1.08, .068), s), V(.034, .12, .02), V(0, 1, 0), .014);                       // rektus abdominis
  E(M(V(.075, 1.315, .052), s), V(.082, .056, .034), V(s * .3, 1, 0), .02, V(s, .35, 0));  // pektoral

  E(M(V(.06, 1.3, -.112), s), V(.07, .135, .032), V(-s * .35, 1, 0), .02, V(s * .7, .7, 0));  // orta-alt trapez
  E(M(V(.106, 1.16, -.072), s), V(.075, .14, .045), V(s * .4, 1, 0), .02, V(s * .45, 1, 0)); // latissimus
  C(M(V(.033, .94, -.092), s), M(V(.03, 1.45, -.083), s), .031, .021, .014);               // erektör spina
  E(M(V(.112, 1.398, -.075), s), V(.075, .04, .045), V(s * .25, 1, 0), .02, V(s, .15, 0));  // supraspinatus / omuz üstü
  E(M(V(.105, 1.31, -.118), s), V(.07, .065, .03), V(s * .6, 1, 0), .015, V(s, .2, 0));  // infraspinatus
  E(M(V(.198, 1.375, -.012), s), V(.058, .085, .06), V(s * .15, 1, 0), .02);                // deltoid
  E(M(V(.125, 1.06, 0), s), V(.045, .1, .075), V(0, 1, 0), .03, V(-s * .5, 1, .4));         // oblik
  E(M(V(.072, .875, -.068), s), V(.085, .095, .07), V(s * .4, 1, 0), .03, V(s * .7, -.7, 0)); // gluteus
  const si = s > 0 ? 0 : 1, sh = SH[si], el = EL[si], wr = WR[si], hp = HP[si], kn = KN[si], an = AN[si];
  const ua = el.clone().sub(sh), fa = wr.clone().sub(el), th = kn.clone().sub(hp), sn = an.clone().sub(kn);

  E(sh.clone().lerp(el, .45).add(V(0, 0, -.025)), V(.033, .09, .031), ua, .015);            // triseps
  C(el, wr, .035, .022, .03);                                                               // ön kol
  E(el.clone().lerp(wr, .28).add(V(-s * .005, 0, .006)), V(.031, .07, .029), fa, .02);      // ön kol kasları
  E(wr.clone().add(V(s * .004, -.048, .004)), V(.013, .043, .03), V(0, 1, 0), .012);        // el
  for (let f = 0; f < 4; f++) C(wr.clone().add(V(s * .003, -.075, -.016 + f * .0105)), wr.clone().add(V(-s * .006, -.122 + Math.abs(f - 1.5) * .006, -.019 + f * .013)), .0078, .006, .007);
  C(wr.clone().add(V(-s * .008, -.03, .022)), wr.clone().add(V(-s * .02, -.078, .036)), .0085, .0065, .008);
  C(hp, kn, .085, .052, .04);                                                               // uyluk
  E(hp.clone().lerp(kn, .45).add(V(0, 0, .03)), V(.058, .17, .044), th, .02);               // kuadriseps
  E(hp.clone().lerp(kn, .45).add(V(0, 0, -.035)), V(.054, .16, .044), th, .02);             // hamstring
  E(hp.clone().lerp(kn, .3).add(V(-s * .036, 0, 0)), V(.04, .12, .04), th, .025);           // addüktör
  E(kn, V(.045, .05, .045), V(0, 1, 0), .02);                                               // diz
  C(kn, an, .045, .027, .03);                                                               // bacak

// omurga kabartısı (afişteki gibi sırttan seçilen omurlar)
const SPINE = new THREE.CatmullRomCurve3([V(0, .97, -.065), V(0, 1.07, -.05), V(0, 1.2, -.085), V(0, 1.32, -.09), V(0, 1.43, -.06), V(0, 1.53, -.03), V(0, 1.615, -.025)]);
for (let i = 0; i < 22; i++) { const p = SPINE.getPointAt(.02 + i * .042); E(V(0, p.y, p.z - .052 - (p.y > 1.42 ? -.012 : 0)), V(.011, .009, .011), V(0, 1, 0), .008, V(0, 1, 0)); }
PRIMS.sort((a, b) => b.R - a.R);

function primD(P, x, y, z) {
  if (P.t === 0) {
    const dx = x - P.c.x, dy = y - P.c.y, dz = z - P.c.z;
    const qx = dx * P.ex.x + dy * P.ex.y + dz * P.ex.z, qy = dx * P.ey.x + dy * P.ey.y + dz * P.ey.z, qz = dx * P.ez.x + dy * P.ez.y + dz * P.ez.z;
    const a = qx / P.r.x, b = qy / P.r.y, c = qz / P.r.z;
    const k0 = Math.sqrt(a * a + b * b + c * c);
    const a2 = a / P.r.x, b2 = b / P.r.y, c2 = c / P.r.z, k1 = Math.sqrt(a2 * a2 + b2 * b2 + c2 * c2);
    return k1 < 1e-9 ? -Math.min(P.r.x, P.r.y, P.r.z) : k0 * (k0 - 1) / k1;
  }
  // yuvarlatılmış koni (iq)
  const bax = P.b.x - P.a.x, bay = P.b.y - P.a.y, baz = P.b.z - P.a.z;
  const l2 = bax * bax + bay * bay + baz * baz, rr = P.ra - P.rb, a2 = l2 - rr * rr, il2 = 1 / l2;
  const pax = x - P.a.x, pay = y - P.a.y, paz = z - P.a.z;
  const yy = pax * bax + pay * bay + paz * baz, zz = yy - l2;
  const wx = pax * l2 - bax * yy, wy = pay * l2 - bay * yy, wz = paz * l2 - baz * yy;
  const x2 = wx * wx + wy * wy + wz * wz, y2 = yy * yy * l2, z2 = zz * zz * l2;
  const k = Math.sign(rr) * rr * rr * x2;
  if (Math.sign(zz) * a2 * z2 > k) return Math.sqrt(x2 + z2) * il2 - P.rb;
  if (Math.sign(yy) * a2 * y2 < k) return Math.sqrt(x2 + y2) * il2 - P.ra;
  return (Math.sqrt(x2 * a2 * il2) + yy * rr) * il2 - P.ra;

    const P = PRIMS[i];

    const lb = Math.sqrt(lx * lx + ly * ly + lz * lz) - P.R;

    d = Math.min(d, di) - h * h * P.k * .25;

}
function veil(y0, y1, a, top = true) {           // yazı arkası için krem geçiş
  if (a <= 0) return;

const ICON_PIN = new Path2D('M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z');
const ICON_TEL = new Path2D('M20.01 15.38c-1.23 0-2.42-.2-3.53-.56-.35-.12-.74-.03-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z');
function icon(path, x, y, s, a) { ctx.save(); ctx.globalAlpha = a; ctx.translate(x - 12 * s, y - 12 * s); ctx.scale(s, s); ctx.fillStyle = `rgb(${BRAND.dark})`; ctx.fill(path); ctx.restore(); }

function overlay(t) {
  ctx.drawImage(glc, 0, 0);
  // açılış: kremden belirme
  const op = 1 - sm(0, .7, t);
  if (op > 0) { ctx.fillStyle = `rgba(244,241,234,${op})`; ctx.fillRect(0, 0, W, H); }
  // hafif vinyet
  const vg = ctx.createRadialGradient(W / 2, H * .48, H * .3, W / 2, H / 2, H * .78);
  vg.addColorStop(0, 'rgba(90,100,80,0)'); vg.addColorStop(1, 'rgba(90,100,80,.16)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  const D = BRAND.dark, G = BRAND.green;
  // 1) Ağrı burada / Peki ya kaynağı?
  veil(H, H * .7, .75 * win2(t, 1.7, 3.5) + .75 * win2(t, 5.1, 8.1), false);
  textReveal('Ağrı burada.', W / 2, H * .845, 92, 1.9, 2.6, 3.3, t, { weight: 600, color: D });
  textReveal('Peki ya kaynağı?', W / 2, H * .845, 96, 5.3, 6.1, 7.7, t, { weight: 600, italic: true, color: G });
  // 2) Osteopatik bakış
  veil(0, H * .34, .85 * win2(t, 9.5, 12.6));
  textReveal('Vücudunuz', W / 2, H * .085, 104, 9.7, 10.5, 12.2, t, { weight: 600, color: D });
  textReveal('bir bütündür.', W / 2, H * .085 + 100, 104, 9.95, 10.8, 12.2, t, { weight: 600, italic: true, color: G });
  { const lw = eio(inv(10.5, 11.2, t)) * 110 * (1 - sm(12.2, 12.8, t)); if (lw > 0) { ctx.fillStyle = `rgba(${G},.8)`; ctx.fillRect(W / 2 - lw / 2, H * .085 + 172, lw, 2); } }
  textReveal('Osteopatik bakış açısı.', W / 2, H * .085 + 222, 52, 10.6, 11.3, 12.2, t, { weight: 500, italic: true, color: D });
  // 3) Ana mesaj
  const tm = 12.9;
  { const a = sm(tm - .4, tm + .6, t) * (1 - sm(15.9, 16.6, t)) * .62; if (a > 0) { ctx.fillStyle = `rgba(244,241,234,${a})`; ctx.fillRect(0, 0, W, H); } }
  textReveal('Ağrının olduğu yer,', W / 2, H * .44, 100, tm, tm + .9, 15.9, t, { weight: 600, color: D });
  textReveal('kaynağı olmayabilir.', W / 2, H * .44 + 104, 100, tm + .8, tm + 1.8, 15.9, t, { weight: 600, italic: true, color: G });
  // 4) Marka + iletişim kartı (afiş düzeni)
  const tb = 16.3;
  if (t > tb) {
    veil(0, H * .3, .92 * sm(tb, tb + .8, t));
    veil(H, H * .8, .92 * sm(tb, tb + .8, t), false);
    textReveal(BRAND.title, W / 2, H * .06, 34, tb + .3, tb + 1.0, 99, t, { weight: 500, font: SANS, track: 16, color: D });
    textReveal(BRAND.name, W / 2, H * .06 + 80, 104, tb + .45, tb + 1.25, 99, t, { weight: 600, track: 2, color: G, maxW: 980 });
    BRAND.lines.forEach((ln, i) => textReveal(ln, W / 2, H * .06 + 160 + i * 52, 34, tb + .8 + i * .15, tb + 1.5 + i * .15, 99, t, { font: SANS, track: .5, color: D, maxW: 980 }));
    // alt iletişim satırı
    const ca = sm(tb + 1.1, tb + 1.9, t), cy = H * .925, dy = (1 - eio(inv(tb + 1.1, tb + 1.9, t))) * 14;
    if (ca > 0) {
      const lw = eio(inv(tb + 1.0, tb + 1.8, t));
      ctx.fillStyle = `rgba(${D},${.55 * ca})`;
      ctx.fillRect(36, cy, 64 * lw, 1.5); ctx.fillRect(W - 36 - 50 * lw, cy, 50 * lw, 1.5);
      ctx.fillRect(W * .535, cy - 40 + dy, 1.5, 80);
      icon(ICON_PIN, 150, cy + dy, 1.75, ca);
      text(BRAND.address[0], 186, cy - 20, 32, ca, { font: SANS, weight: 400, color: D, align: 'left', dy, maxW: 360 });
      text(BRAND.address[1], 186, cy + 22, 32, ca, { font: SANS, weight: 400, color: D, align: 'left', dy, maxW: 360 });
      icon(ICON_TEL, W * .535 + 48, cy + dy, 1.75, ca);
      text(BRAND.phone, W * .535 + 82, cy, 34, ca, { font: SANS, weight: 500, color: D, align: 'left', dy, maxW: 300 });

function win2(t, a, b, f = .6) { return sm(a, a + f, t) * (1 - sm(b - f, b, t)); }

/* =====================================================================
   SAHNE DURUMU (zamana göre)
   ===================================================================== */
function update(t) {
  camAt(t);
  bgU.uT.value = t;
  dust.uniforms.uT.value = t; dust.uniforms.uA.value = sm(0, 2, t);
  // beden: altın tarama çizgisiyle belirir; yakın planda iç yapılar için saydamlaşır
  const scan = lerp(-.05, 1.86, eio(inv(.2, 2.4, t)));
  bodyU.uT.value = t; bodyU.uA.value = sm(.1, .5, t);
  bodyU.uScan.value = t < 2.5 ? scan + .02 : 99; boneU.uScan.value = t < 2.5 ? scan : 99;
  bodyU.uXray.value = sm(3.6, 5.4, t) * (1 - sm(8.6, 10.6, t));
  const bA = sm(.2, .8, t);
  boneMats.forEach(({ m, k }) => m.opacity = bA * k);
  boneU.uT.value = t;
  hiA.userData.hi.value = sm(4.6, 6, t) * (1 - sm(8.6, 10, t)) * .7;
  hiB.userData.hi.value = sm(9.4, 10.6, t) * (1 - sm(12.2, 13.4, t)) * 1.9;
  const br = .5 + .5 * Math.sin(t * 1.35 - 1.2);
  ribP.o.scale.set(1 + .014 * br, 1 + .004 * br, 1 + .022 * br);
  // ağrı
  const beat = .5 + .5 * Math.sin(t * 5.7);
  const painI = sm(1.6, 2.4, t) * (1 - sm(11.2, 13.4, t) * .85) * (1 - sm(16.0, 16.8, t));
  bodyU.uPainI.value = painI; bodyU.uPainR.value = .1 + .02 * beat;
  const near = sm(3.5, 6, t) * (1 - sm(8.5, 11, t));
  painCore.material.opacity = painI * (.55 + .3 * beat) * (1 - near * .4);
  painCore.scale.setScalar(.1 + .03 * beat - near * .055);
  painHalo.material.opacity = painI * (.28 + .14 * beat) * (1 - near * .75);
  painHalo.scale.setScalar(.36 - near * .26);
  painLight.position.copy(PAIN).add(V(.03, .02, -.06)); painLight.intensity = painI * (.25 + .15 * beat);
  const hs = sm(11.5, 13.5, t);
  painCore.material.color.setRGB(lerp(.85, 1.6, hs), lerp(.15, 1.15, hs), lerp(.1, .5, hs));

    const ph = ((t * .9 + i / 3) % 1);
    r.material.opacity = painI * (1 - ph) * .5 * (1 - near * .6);
    r.scale.setScalar(.06 + ph * .26 * (1 - near * .6));

  // bağlantı hatları
  const t0A = 4.0, t0B = 8.6, t0C = 9.0;
  for (const L of lines) for (const u of L.us) {
    u.uT.value = t;
    if (L.group === 'A') {
      u.uRev.value = eio(inv(t0A + L.d, t0A + L.d + 1.9, t));
      u.uA.value = sm(t0A + L.d, t0A + L.d + .3, t) * (1 - sm(10.5, 13, t) * .7) * (1 - sm(16, 16.8, t));
      u.uPulse.value = sm(6, 7, t); u.uDir.value = 1;
    } else if (L.group === 'B') {
      u.uRev.value = eio(inv(t0B + L.d, t0B + L.d + 2.6, t));
      u.uA.value = sm(t0B + L.d, t0B + L.d + .3, t) * (1 - sm(12.5, 14, t) * .35) * (1 - sm(16, 16.8, t) * .6);
      u.uPulse.value = sm(10.5, 11.5, t); u.uDir.value = -1;
    } else {
      u.uRev.value = eio(inv(t0C + L.d, t0C + L.d + 2.8, t));
      u.uA.value = sm(t0C + L.d, t0C + L.d + .3, t);
      u.uPulse.value = sm(11, 12, t) * .8; u.uDir.value = 1;
    }
  }
  nodes.forEach(n => {
    const a = sm(9.6 + n.userData.d * 2.2, 10.4 + n.userData.d * 2.2, t) * (1 - sm(16.0, 16.8, t));
    const b = .55 + .45 * Math.sin(t * 3.1 + n.userData.ph);
    n.material.opacity = a * b * .9; n.scale.setScalar(.05 + .025 * b);
  });
  bodyU.uWave.value = t > 8.4 && t < 12 ? (t - 8.4) * .55 : 0;
}

function renderAt(t) { update(t); composer.render(); overlay(t); }
window.renderFrame = i => renderAt(i / FPS);
window.renderAt = renderAt;
