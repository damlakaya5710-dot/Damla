<!doctype html>
<html lang="tr">

<style>

  #gl{position:absolute;left:-99999px;top:0}
  #play{position:fixed;inset:0;margin:auto;width:220px;height:60px;border:1px solid #ffffff55;background:#0008;color:#fff;
        font:300 18px Inter,sans-serif;letter-spacing:.2em;cursor:pointer;border-radius:30px;display:none}
</style>

</script>

<body>
<canvas id="out" width="1080" height="1920"></canvas>
<button id="play">OYNAT ▶</button>
<script type="module">
/* =====================================================================
   ALPARSLAN — "Ağrı burada, peki ya kaynağı?"  (1080x1920, 30 fps, 19 sn)
   Three.js ile prosedürel 3B anatomik animasyon.
   Her kare renderFrame(i) ile deterministik çizilir (render.js bunu kullanır).
   ?play=1 → tarayıcıda gerçek zamanlı önizleme (müzik: output/muzik.wav)
   ===================================================================== */
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ---------------- marka ayarları (buradan değiştirilebilir) ---------------- */
const BRAND = {
  title: 'FİZYOTERAPİST',
  name: 'ALPARSLAN ERİŞTİ',
  lines: [[['Osteopati', 600], ['  |  Manuel Terapi', 400]], [['Psikonöroimmünoloji  |  Klinik Pilates', 400]]],
  handle: '',                                  // ör. '@alparslaneristi' (boş bırakılırsa çizilmez)
  cream: '#f1eee7', green: '35,47,31', sage: '143,163,132',
};

const W = 1080, H = 1920, FPS = 30, DUR = 19, NF = FPS * DUR;
window.NF = NF;

/* ---------------- yardımcılar ---------------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const inv = (a, b, x) => clamp((x - a) / (b - a));
const sm = (a, b, x) => { const t = inv(a, b, x); return t * t * (3 - 2 * t); };
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;   // easeInOutCubic
const win = (t, a, b, f = .6) => sm(a, a + f, t) * (1 - sm(b - f, b, t));    // giriş-çıkış penceresi
const V = (x, y, z) => new THREE.Vector3(x, y, z);

/* ---------------- renderer ---------------- */
const glc = document.createElement('canvas'); glc.id = 'gl'; document.body.appendChild(glc);
const renderer = new THREE.WebGLRenderer({ canvas: glc, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = .85;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x03060b);
scene.fog = new THREE.FogExp2(0x03060b, 0.06);
const camera = new THREE.PerspectiveCamera(30, W / H, 0.02, 60);

/* ---------------- ışıklar ---------------- */
scene.add(new THREE.HemisphereLight(0xb0ccff, 0x161620, 0.9));
const key = new THREE.DirectionalLight(0xfff4e8, 1.3); key.position.set(2, 3, 3); scene.add(key);
const rim = new THREE.DirectionalLight(0x5fb6ff, 1.4); rim.position.set(-3, 2, -3); scene.add(rim);
const painLight = new THREE.PointLight(0xff2020, 0, 0.2, 2); scene.add(painLight);

/* ---------------- arka plan: koyu gradyan küre + yüzen toz ---------------- */
{
  const g = new THREE.SphereGeometry(30, 32, 16);
  const m = new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    vertexShader: `varying vec3 vP; void main(){ vP=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `varying vec3 vP; void main(){
      float h=vP.y*.5+.5; vec3 c=mix(vec3(.004,.008,.016),vec3(.012,.03,.055),smoothstep(.25,.75,h));
      c+=vec3(.02,.04,.07)*pow(max(0.,1.-abs(vP.y-.05)*2.),3.);
      gl_FragColor=vec4(c,1.); }`
  });
  scene.add(new THREE.Mesh(g, m));
}
let rnd = (() => { let s = 1234567; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
const dust = (() => {
  const n = 900, pos = new Float32Array(n * 3), ph = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    pos[i * 3] = (rnd() - .5) * 6; pos[i * 3 + 1] = rnd() * 3.2 - .2; pos[i * 3 + 2] = (rnd() - .5) * 6; ph[i] = rnd() * 100;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('ph', new THREE.BufferAttribute(ph, 1));
  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, uniforms: { uT: { value: 0 }, uA: { value: 1 } },
    vertexShader: `attribute float ph; uniform float uT; varying float vA;
      void main(){ vec3 p=position; p.y+=sin(uT*.2+ph)*.08+uT*.012; p.x+=sin(uT*.13+ph*1.7)*.05;
        vec4 mv=modelViewMatrix*vec4(p,1.); gl_Position=projectionMatrix*mv;
        gl_PointSize=clamp(10./-mv.z,1.,6.); vA=.25+.25*sin(uT*.8+ph); }`,
    fragmentShader: `uniform float uA; varying float vA; void main(){ float d=length(gl_PointCoord-.5);
      gl_FragColor=vec4(vec3(.55,.75,1.)*smoothstep(.5,0.,d)*vA*uA,1.); }`
  });
  const p = new THREE.Points(g, m); scene.add(p); return m;
})();

/* =====================================================================
   1) DERİ: Fresnel "cam beden" (x-ray hissi), ağrı bölgesi kırmızıya döner
   ===================================================================== */
const PAIN = V(0.185, 1.415, 0.0);
const skinU = {
  uT: { value: 0 }, uA: { value: 0 }, uPain: { value: PAIN }, uPainI: { value: 0 }, uPainR: { value: .12 },
  uWave: { value: 0 }, uWaveC: { value: V(0, 0, 0) }, uScan: { value: -1 }
};
const skinMat = new THREE.ShaderMaterial({
  uniforms: skinU, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `varying vec3 vN; varying vec3 vV; varying vec3 vW;
    void main(){ vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz; vN=normalize(mat3(modelMatrix)*normal);
      vV=normalize(cameraPosition-w.xyz); gl_Position=projectionMatrix*viewMatrix*w; }`,
  fragmentShader: `uniform float uT,uA,uPainI,uPainR,uWave,uScan; uniform vec3 uPain,uWaveC;
    varying vec3 vN; varying vec3 vV; varying vec3 vW;
    void main(){
      float f=pow(1.-abs(dot(normalize(vN),vV)),2.4);
      vec3 base=vec3(.30,.62,1.)*(f*.38+.012);
      // yatay tarama çizgileri: çok ince, premium "tarayıcı" dokusu
      base*=.9+.1*sin(vW.y*420.);
      float d=distance(vW,uPain);
      float pm=smoothstep(uPainR,0.,d)*uPainI;
      float beat=.75+.25*sin(uT*5.7);
      vec3 red=vec3(1.,.07,.04)*(f*.9+.22)*beat;
      vec3 c=mix(base,red,pm);
      // bütünlük dalgası: merkezden tüm bedene yayılan ışık halkası
      float wd=distance(vW,uWaveC);
      c+=vec3(.5,.8,1.)*smoothstep(.06,0.,abs(wd-uWave))*step(.001,uWave)*(f*.6+.1)*.6;
      c*=smoothstep(uScan+.01,uScan-.03,vW.y);
      c+=vec3(.55,.88,1.)*smoothstep(.012,0.,abs(vW.y-uScan))*(f*.8+.25);   // tarama halkası
      gl_FragColor=vec4(c*uA,1.);
    }`
});
const body = new THREE.Group(); scene.add(body);
function addSkin(geo, pos, scl) { const m = new THREE.Mesh(geo, skinMat); if (pos) m.position.copy(pos); if (scl) m.scale.copy(scl); body.add(m); return m; }
function limb(a, b, ra, rb, mat = skinMat, seg = 28) {           // a→b arası konik silindir
  const len = a.distanceTo(b);
  const g = new THREE.CylinderGeometry(rb, ra, len, seg, 1, true);
  const m = new THREE.Mesh(g, mat);
  m.position.copy(a).add(b).multiplyScalar(.5);
  m.quaternion.setFromUnitVectors(V(0, 1, 0), b.clone().sub(a).normalize());
  return m;
}
// gövde (lathe profili)
{
  const prof = [[0, .84], [.11, .855], [.165, .9], [.172, .95], [.158, 1.01], [.138, 1.07], [.142, 1.13], [.158, 1.2],
                [.176, 1.28], [.188, 1.35], [.18, 1.405], [.13, 1.445], [.075, 1.47], [.05, 1.49]].map(([r, y]) => new THREE.Vector2(r, y));
  const g = new THREE.LatheGeometry(prof, 64);
  addSkin(g, V(0, 0, -.03), V(1, 1, .64));
}
addSkin(new THREE.CylinderGeometry(.047, .056, .14, 32, 1, true), V(0, 1.53, -.02));               // boyun
const headSkin = addSkin(new THREE.SphereGeometry(.1, 48, 32), V(0, 1.665, .0), V(.86, 1.18, 1.02));                    // baş
const SH = [V(.19, 1.405, -.02), V(-.19, 1.405, -.02)], EL = [V(.245, 1.12, -.02), V(-.245, 1.12, -.02)],
      WR = [V(.285, .86, .03), V(-.285, .86, .03)], HP = [V(.095, .9, -.02), V(-.095, .9, -.02)],
      KN = [V(.1, .5, 0), V(-.1, .5, 0)], AN = [V(.1, .085, -.02), V(-.1, .085, -.02)];
for (let s = 0; s < 2; s++) {
  addSkin(new THREE.SphereGeometry(.058, 32, 24), SH[s].clone().add(V(s ? -.008 : .008, -.01, 0)), V(1, 1.05, .95)); // deltoid
  body.add(limb(SH[s].clone().add(V(0, -.03, 0)), EL[s], .05, .038));
  body.add(limb(EL[s], WR[s], .037, .026));
  addSkin(new THREE.SphereGeometry(.03, 24, 16), WR[s].clone().add(V(s ? -.008 : .008, -.06, .005)), V(.68, 1.95, 1.1)); // el
  body.add(limb(HP[s], KN[s], .078, .05));
  body.add(limb(KN[s], AN[s], .05, .032));
  addSkin(new THREE.SphereGeometry(.04, 24, 16), V(s ? -.1 : .1, .035, .04), V(.8, .55, 2.0));   // ayak
}

/* =====================================================================
   2) İSKELET: anatomik kemikler
      - kemikler ayaktan başa yükselen bir tarama çizgisiyle belirir
      - kaburga kafesi nefes alır, baş ağrıdan hafifçe uzaklaşır
      - osteopatik vurgu: yakın planda omuz kuşağı + torakal omurga,
        geniş planda leğen, sakrum, ayaklar, kafatası ve çene yanar
   ===================================================================== */
const boneU = { uScan: { value: -1 }, uT: { value: 0 } };
const boneTex = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d');
  x.fillStyle = '#808080'; x.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 2600; i++) {
    x.fillStyle = rnd() < .5 ? 'rgba(255,255,255,.12)' : 'rgba(0,0,0,.14)';
    x.beginPath(); x.arc(rnd() * 256, rnd() * 256, .6 + rnd() * 2.6, 0, Math.PI * 2); x.fill();
  }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(3, 3); return t;
})();
const boneMats = [];
function makeBoneMat(opts = {}, k = 1) {
  const m = new THREE.MeshPhysicalMaterial({
    color: 0xf2eadb, roughness: .46, metalness: 0, clearcoat: .35, clearcoatRoughness: .45, sheen: .5,
    sheenColor: new THREE.Color(0x9fc8ff), emissive: 0x1c1914, bumpMap: boneTex, bumpScale: .5,
    transparent: true, opacity: 0, side: THREE.DoubleSide, ...opts
  });
  m.userData.hi = { value: 0 };
  m.onBeforeCompile = sh => {
    sh.uniforms.uScan = boneU.uScan; sh.uniforms.uT = boneU.uT; sh.uniforms.uHi = m.userData.hi;
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vWP;')
      .replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\nvWP=(modelMatrix*vec4(transformed,1.)).xyz;');
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>', '#include <common>\nvarying vec3 vWP; uniform float uScan,uHi,uT;')
      .replace('#include <clipping_planes_fragment>', '#include <clipping_planes_fragment>\nif(vWP.y>uScan) discard;')
      .replace('#include <emissivemap_fragment>', `#include <emissivemap_fragment>
        float fr=pow(1.-abs(dot(normal,normalize(vViewPosition))),2.5);
        totalEmissiveRadiance+=vec3(.35,.6,1.)*fr*.3;                                        // soğuk kenar ışığı
        totalEmissiveRadiance+=vec3(.55,.85,1.)*smoothstep(.04,0.,uScan-vWP.y)*3.;            // tarama çizgisi
        totalEmissiveRadiance+=vec3(1.,.62,.3)*uHi*(.06+.5*fr)*(.75+.25*sin(uT*4.+vWP.y*30.)); // osteopatik vurgu`);
  };
  boneMats.push({ m, k }); return m;
}
const boneMat = makeBoneMat();
const hiA = makeBoneMat(), hiB = makeBoneMat();                        // vurgulanan kemik grupları
const cartMat = makeBoneMat({ color: 0x9cc8ff, emissive: 0x0e2236, roughness: .3, bumpMap: null }, .55);   // kıkırdak / disk
const darkMat = makeBoneMat({ color: 0x050607, emissive: 0x000000, roughness: .9, sheen: 0, clearcoat: 0, bumpMap: null });

const skel = new THREE.Group(); scene.add(skel);
// pivotlu alt gruplar: baş (eğilme) ve göğüs kafesi (nefes)
function pivot(parent, p) { const o = new THREE.Group(); o.position.copy(p); parent.add(o); const i = new THREE.Group(); i.position.copy(p).multiplyScalar(-1); o.add(i); return { o, i }; }
const headP = pivot(skel, V(0, 1.6, -.025));
const ribP = pivot(skel, V(0, 1.26, -.09));

function put(m, parent = skel) { parent.add(m); return m; }
function orient(m, a, b) { m.position.copy(a); m.quaternion.setFromUnitVectors(V(0, 1, 0), b.clone().sub(a).normalize()); return m; }
// uzun kemik: ince gövde + şişkin uçlar (epifiz), lathe profili
function longBone(a, b, r, { e0 = .8, e1 = .8, w = .1, mat = boneMat, seg = 16, parent = skel } = {}) {
  const len = a.distanceTo(b), pts = [], n = 28;
  for (let i = 0; i <= n; i++) {
    const u = i / n;
    let rr = r * (1 + e0 * Math.exp(-(((u - .04) / w) ** 2)) + e1 * Math.exp(-(((.96 - u) / w) ** 2)));
    rr *= Math.sin(Math.min(1, Math.min(u, 1 - u) / .045) * Math.PI / 2);
    pts.push(new THREE.Vector2(Math.max(rr, 1e-5), u * len));
  }
  return put(orient(new THREE.Mesh(new THREE.LatheGeometry(pts, seg), mat), a, b), parent);
}
function ball(p, r, s, mat = boneMat, parent = skel) { const m = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 14), mat); m.position.copy(p); if (s) m.scale.copy(s); return put(m, parent); }
function tube(pts, r, mat = boneMat, parent = skel, closed = false) {
  const c = new THREE.CatmullRomCurve3(pts, closed, 'centripetal');
  return put(new THREE.Mesh(new THREE.TubeGeometry(c, Math.max(20, Math.round(c.getLength() * 300)), r, 10, closed), mat), parent);
}

/* ---------- kafatası ---------- */
{
  const H_ = headP.i;
  const g = new THREE.SphereGeometry(1, 56, 40), p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    let x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    if (y < -.4) y = -.4 + (y + .4) * .6;                             // kafa tabanı
    x *= .072 * (1 - .07 * Math.exp(-(((y + .05) / .3) ** 2)));           // şakak çukuru
    z *= z < 0 ? .094 : .088; y *= .08;
    p.setXYZ(i, x, y, z);
  }
  g.computeVertexNormals();
  const cr = new THREE.Mesh(g, hiB); cr.position.set(0, 1.705, -.012); H_.add(cr);
  // yüz: üst çene + elmacık
  ball(V(0, 1.646, .036), 1, V(.05, .042, .045), boneMat, H_);
  tube([V(-.046, 1.692, .062), V(-.02, 1.7, .076), V(0, 1.697, .079), V(.02, 1.7, .076), V(.046, 1.692, .062)], .0075, boneMat, H_);   // kaş kemeri
  for (const s of [1, -1]) {
    ball(V(s * .026, 1.668, .068), 1, V(.0185, .016, .012), darkMat, H_);                                    // göz çukuru
    tube([V(s * .045, 1.672, .062), V(s * .05, 1.655, .06), V(s * .042, 1.646, .066), V(s * .026, 1.648, .074)], .004, boneMat, H_); // orbita alt kenarı
    tube([V(s * .045, 1.65, .055), V(s * .062, 1.652, .028), V(s * .068, 1.652, .0)], .005, boneMat, H_);    // elmacık kemeri
    ball(V(s * .066, 1.646, -.01), .007, null, hiB, H_);                                                     // çene eklemi (TME)
  }
  ball(V(0, 1.639, .08), 1, V(.0075, .012, .006), darkMat, H_);                                              // burun açıklığı
  // dişler
  for (const [yy, rz] of [[1.614, .036], [1.603, .033]])
    for (let k = 0; k < 14; k++) {
      const a = -1.15 + k * 2.3 / 13;
      const m = new THREE.Mesh(new THREE.BoxGeometry(.0045, .008, .004), boneMat);
      m.position.set(Math.sin(a) * .026, yy, .03 + Math.cos(a) * rz * .95); m.rotation.y = a; H_.add(m);
    }
  // alt çene
  tube([V(-.064, 1.648, -.008), V(-.058, 1.605, -.004), V(-.04, 1.588, .036), V(-.016, 1.58, .058), V(0, 1.578, .063),
        V(.016, 1.58, .058), V(.04, 1.588, .036), V(.058, 1.605, -.004), V(.064, 1.648, -.008)], .0075, hiB, H_);
}

/* ---------- omurga (24 omur + diskler) ---------- */
const SPINE = new THREE.CatmullRomCurve3([V(0, .97, -.065), V(0, 1.07, -.05), V(0, 1.2, -.085), V(0, 1.32, -.09), V(0, 1.43, -.06), V(0, 1.53, -.03), V(0, 1.615, -.025)]);
const vert = [];
for (let i = 0; i < 24; i++) {          // i: 0 = L5 … 4 = L1, 5 = T12 … 16 = T1, 17 = C7 … 23 = C1
  const u = (i + .5) / 24, p = SPINE.getPointAt(u), tg = SPINE.getTangentAt(u);
  const reg = i < 5 ? 'L' : i < 17 ? 'T' : 'C';
  const r = reg === 'L' ? .021 : reg === 'T' ? .0145 + (16 - i) * .0004 : .0115, h = reg === 'L' ? .019 : reg === 'T' ? .016 : .011;
  const mat = (i >= 11 && i <= 19) ? hiA : (i <= 1 ? hiB : boneMat);   // T6–C5 yakın plan, L4–L5 geniş plan
  const grp = new THREE.Group(); grp.position.copy(p); grp.quaternion.setFromUnitVectors(V(0, 1, 0), tg); skel.add(grp);
  const prof = [[0, -h / 2], [r * .93, -h / 2], [r, -h * .35], [r * .88, 0], [r, h * .35], [r * .93, h / 2], [0, h / 2]].map(([a, b]) => new THREE.Vector2(a, b));
  grp.add(new THREE.Mesh(new THREE.LatheGeometry(prof, 18), mat));
  const arch = new THREE.Mesh(new THREE.TorusGeometry(r * .62, r * .2, 6, 14, Math.PI), mat);
  arch.rotation.x = -Math.PI / 2; arch.position.z = -r * .85; grp.add(arch);
  const spL = reg === 'L' ? .028 : reg === 'T' ? .034 : .018;
  const sp = new THREE.Mesh(new THREE.CylinderGeometry(.0025, .005, spL, 6), mat);
  sp.position.set(0, reg === 'T' ? -.008 : -.002, -r * 1.45 - spL * .4); sp.rotation.x = reg === 'T' ? -1.0 : reg === 'L' ? -1.45 : -1.25; grp.add(sp);
  for (const s of [1, -1]) {
    const tpL = reg === 'L' ? .03 : reg === 'T' ? .026 : .02;
    const tp = new THREE.Mesh(new THREE.CylinderGeometry(.0022, .0038, tpL, 6), mat);
    tp.position.set(s * (r * .55 + tpL / 2), 0, -r * 1.05); tp.rotation.z = s * Math.PI / 2; tp.rotation.y = reg === 'T' ? -s * .5 : 0; grp.add(tp);
  }
  vert.push({ p, r, h });
}
for (let i = 0; i < 23; i++) {         // omurlar arası diskler
  const a = vert[i], b = vert[i + 1], m = a.p.clone().add(b.p).multiplyScalar(.5);
  const gap = Math.max(.003, a.p.distanceTo(b.p) - (a.h + b.h) / 2);
  const d = new THREE.Mesh(new THREE.CylinderGeometry(Math.min(a.r, b.r) * .92, Math.min(a.r, b.r) * .92, gap, 16), cartMat);
  orient(d, m, b.p).position.copy(m); skel.add(d);
}
const spineZ = y => { let best = 0, bd = 9; for (let u = 0; u <= 1; u += .01) { const p = SPINE.getPointAt(u); const d = Math.abs(p.y - y); if (d < bd) { bd = d; best = p.z; } } return best; };

/* ---------- göğüs kafesi (12 çift kaburga, kıkırdak, sternum) ---------- */
{
  const R_ = ribP.i;
  for (let k = 0; k < 12; k++) {
    const y = 1.388 - k * .0245, zs = spineZ(y);
    const a = .058 + .068 * Math.sin(Math.PI * Math.min(1, (k + 1.2) / 12.5)) * (k > 9 ? .92 : 1);
    const fy = y - .052 - k * .002, mat = k <= 2 ? null : boneMat;
    for (const s of [1, -1]) {

      if (k < 10) {

  const parts = Array.isArray(str) ? str : [[str, weight]];
  const fnt = w => `${w} ${size}px "${font}", Inter, sans-serif`;
  let tot = 0; const ws = parts.map(([s_, w]) => { ctx.font = fnt(w); const m = ctx.measureText(s_).width; tot += m; return m; });
  const k = Math.min(1, maxW / tot); ctx.translate(x, y + dy); ctx.scale(k, k);
  ctx.textAlign = 'left'; let cx = -tot / 2;
  parts.forEach(([s_, w], i) => { ctx.font = fnt(w); ctx.fillText(s_, cx, 0); cx += ws[i]; });
  ctx.restore();
}
// harf harf açılan yazı (sinematik)
function textReveal(str, x, y, size, t0, t1, tOut, t, opt = {}) {
  const aOut = 1 - sm(tOut, tOut + .6, t);
  if (t < t0 || aOut <= 0) return;
  const p = inv(t0, t1, t);
  const a = sm(0, 1, p) * aOut;
  const blur = (1 - sm(0, 1, p)) * 10 + sm(tOut, tOut + .6, t) * 6;
  text(str, x, y, size, a, { ...opt, blur, dy: (1 - eio(p)) * 18 });
}
function overlay(t) {
  ctx.drawImage(glc, 0, 0);
  // vinyet
  const vg = ctx.createRadialGradient(W / 2, H * .46, H * .2, W / 2, H / 2, H * .75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.72)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  // açılış/kapanış kararması
  const blk = 1 - sm(0, .9, t);
  if (blk > 0) { ctx.fillStyle = `rgba(0,0,0,${blk})`; ctx.fillRect(0, 0, W, H); }

  // --- yazılar (minimum) ---
  textReveal('Ağrı burada.', W / 2, H * .82, 64, 1.9, 2.6, 3.3, t, { weight: 300, track: 2 });
  textReveal('Peki ya kaynağı?', W / 2, H * .82, 64, 5.3, 6.1, 7.7, t, { weight: 300, track: 2 });
  // osteopatik bakış (geri çekilirken)
  textReveal('OSTEOPATİK BAKIŞ', W / 2, H * .805, 30, 9.7, 10.4, 12.1, t, { weight: 500, font: 'Inter', track: 12, color: '178,205,168' });
  textReveal('Beden bir bütündür.', W / 2, H * .805 + 66, 60, 10.0, 10.9, 12.1, t, { weight: 300, track: 1 });
  // ana mesaj
  const tm = 12.9;
  if (t > tm - .2) {
    const dim = sm(tm - .4, tm + .6, t) * .45;
    ctx.fillStyle = `rgba(0,0,0,${dim})`; ctx.fillRect(0, 0, W, H);
  }
  textReveal('Ağrının olduğu yer,', W / 2, H * .44, 70, tm, tm + .9, 15.9, t, { weight: 300, track: 1 });
  textReveal('kaynağı olmayabilir.', W / 2, H * .44 + 96, 70, tm + .8, tm + 1.8, 15.9, t, { weight: 500, track: 1 });
  // marka kartı: bedenin ışığından krem zemine açılış (marka kimliği renkleri)
  const tb = 16.2;
  if (t > tb) {
    const cy = H * .42, p = sm(tb, tb + 1.1, t);
    // önce bedenden yayılan beyaz ışık, sonra krem marka kartına yumuşak geçiş
    const fl = Math.sin(Math.PI * inv(tb - .2, tb + 1.2, t));
    const fg = ctx.createRadialGradient(W / 2, H * .4, 0, W / 2, H * .4, H * (.25 + .5 * p));
    fg.addColorStop(0, `rgba(235,245,255,${.85 * fl})`); fg.addColorStop(1, 'rgba(235,245,255,0)');
    ctx.fillStyle = fg; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.globalAlpha = p;
    const bg = ctx.createRadialGradient(W / 2, H * .45, 50, W / 2, H * .5, H * .8);
    bg.addColorStop(0, '#f6f4ef'); bg.addColorStop(1, '#e3e0d6'); ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    // köşelerde yumuşak adaçayı yeşili formlar (marka görselindeki gibi)
    for (const [x, y, r, a] of [[-60, 120, 440, .4], [W + 80, H - 120, 500, .34], [W + 40, 160, 260, .14]]) {
      const g = ctx.createRadialGradient(x, y + (1 - p) * 40, 0, x, y, r); g.addColorStop(0, `rgba(${BRAND.sage},${a})`); g.addColorStop(1, `rgba(${BRAND.sage},0)`);
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
    ctx.restore();
    const G = BRAND.green, o = { shadow: false, color: G };
    textReveal(BRAND.title, W / 2, cy - 96, 42, tb + .7, tb + 1.4, 99, t, { ...o, weight: 500, font: 'Inter', track: 18 });
    textReveal(BRAND.name, W / 2, cy, 96, tb + .85, tb + 1.65, 99, t, { ...o, weight: 700, track: 1, maxW: 960 });
    const lw = eio(inv(tb + 1.3, tb + 2.0, t)) * 520;
    if (lw > 0) { ctx.fillStyle = `rgba(${BRAND.sage},.9)`; ctx.fillRect(W / 2 - lw / 2, cy + 74, lw, 2); }
    BRAND.lines.forEach((ln, i) => textReveal(ln, W / 2, cy + 136 + i * 62, 42, tb + 1.5 + i * .18, tb + 2.2 + i * .18, 99, t, { ...o, font: 'Inter', track: 0.5, color: '45,55,42', maxW: 940 }));
    if (BRAND.handle) textReveal(BRAND.handle, W / 2, H * .9, 32, tb + 1.9, tb + 2.5, 99, t, { ...o, weight: 400, font: 'Inter', track: 2 });
  }
  // film greni
  ctx.save(); ctx.globalAlpha = .045; ctx.globalCompositeOperation = 'overlay';
  const f = Math.floor(t * FPS);
  ctx.translate(-(f * 73 % 256), -(f * 151 % 256));
  ctx.fillStyle = ctx.createPattern(grain, 'repeat'); ctx.fillRect(0, 0, W + 256, H + 256); ctx.restore();
}

/* =====================================================================
   SAHNE DURUMU (zamana göre)
   ===================================================================== */
function update(t) {
  camAt(t);
  dust.uniforms.uT.value = t; dust.uniforms.uA.value = sm(0, 2, t) * (1 - sm(16.5, 18, t) * .7);
  // beden ve kemikler
  const bodyA = sm(.2, 1.0, t) * (1 - sm(16.2, 17, t));
  skinU.uT.value = t; skinU.uA.value = bodyA;
  const bA = sm(.2, .8, t) * (1 - sm(16.2, 17, t)) * (.75 + .25 * sm(3.5, 5.5, t) * (1 - sm(9, 12, t) * .5));
  boneMats.forEach(({ m, k }) => m.opacity = bA * k);
  boneU.uT.value = t;
  const scan = lerp(-.05, 1.85, eio(inv(.3, 2.5, t)));
  boneU.uScan.value = t < 2.6 ? scan : 99; skinU.uScan.value = t < 2.6 ? scan + .02 : 99;
  // osteopatik vurgu: önce omuz kuşağı + üst torakal omurga, sonra tüm beden
  hiA.userData.hi.value = sm(4.6, 6, t) * (1 - sm(8.6, 10, t)) * .7;
  hiB.userData.hi.value = sm(9.4, 10.6, t) * (1 - sm(12.2, 13.4, t)) * 1.9;
  // canlılık: nefes ve baş duruşu
  const br = .5 + .5 * Math.sin(t * 1.35 - 1.2);
  ribP.o.scale.set(1 + .014 * br, 1 + .004 * br, 1 + .022 * br);
  headP.o.rotation.z = .07 * sm(1.8, 3.2, t) * (1 - sm(9, 11, t)); headP.o.rotation.x = .03 * sm(2, 3.5, t) * (1 - sm(9, 11, t));
  // ağrı: belirir, yakın planda yoğun; geri çekilince ağın bir parçasına dönüşür
  const beat = .5 + .5 * Math.sin(t * 5.7);                // ~0.9 Hz nabız (müzikle eşleşik)
  const painI = sm(1.6, 2.4, t) * (1 - sm(11.2, 13.4, t) * .8) * (1 - sm(16.3, 17.2, t));
  skinU.uPainI.value = painI; skinU.uPainR.value = .1 + .02 * beat;
  painCore.material.opacity = painI * (.55 + .25 * beat) * (1 - sm(3.5, 6, t) * .5 + sm(8.5, 11, t) * .5);
  painCore.scale.setScalar(.11 + .03 * beat - sm(3.5, 6, t) * .07 + sm(8.5, 11, t) * .05);
  painHalo.material.opacity = painI * (.22 + .12 * beat) * (1 - sm(3.5, 6, t) * .8 + sm(8.5, 11, t) * .7);
  painHalo.scale.setScalar(.4 - sm(3.5, 6, t) * .3 + sm(8.5, 11, t) * .28);
  painLight.position.copy(PAIN).add(V(.03, .02, .06)); painLight.intensity = painI * (.25 + .15 * beat);
  // ağrı rengi kırmızıdan "bilinmez" mavi-beyaza kayar
  const hueShift = sm(11.5, 13.5, t);
  painCore.material.color.setRGB(lerp(1, .75, hueShift), lerp(.16, .9, hueShift), lerp(.1, 1, hueShift));
  rings.forEach((r, i) => {
    const ph = ((t * .9 + i / 3) % 1);
    r.material.opacity = painI * (1 - ph) * .55 * (1 - sm(3.5, 5, t) * .6);
    r.scale.setScalar(.06 + ph * .28 * (1 - sm(3.5, 6, t) * .6));
  });
  // A grubu (omuz çevresi): yakın planda açılır
  const t0A = 4.0, t0B = 8.6;
  for (const L of lines) {
    const u = L.m.uniforms; u.uT.value = t;
    if (L.group === 'A') {
      u.uRev.value = eio(inv(t0A + L.d, t0A + L.d + 1.9, t));
      u.uA.value = sm(t0A + L.d, t0A + L.d + .3, t) * (1 - sm(10.5, 13, t) * .55) * (1 - sm(16.3, 17.4, t));
      u.uPulse.value = sm(6, 7, t); u.uDir.value = 1;
    } else {
      u.uRev.value = eio(inv(t0B + L.d, t0B + L.d + 2.6, t));
      u.uA.value = sm(t0B + L.d, t0B + L.d + .3, t) * (1 - sm(16.3, 17.4, t) * .85);
      // önce omuzdan dışarı, sonra bedenin her yerinden omuza doğru sinyal akışı
      u.uPulse.value = sm(10.5, 11.5, t); u.uDir.value = -1;
    }
  }
  // olası kaynak noktaları
  nodes.forEach(n => {
    const a = sm(9.6 + n.userData.d * 2.2, 10.4 + n.userData.d * 2.2, t) * (1 - sm(16.3, 17.2, t));
    const b = .55 + .45 * Math.sin(t * 3.1 + n.userData.ph);
    n.material.opacity = a * b * .9; n.scale.setScalar(.06 + .03 * b);
  });
  // bütünlük dalgası (yakın plandan çıkışta merkezden yayılır)
  skinU.uWaveC.value.copy(PAIN);
  skinU.uWave.value = t > 8.4 && t < 12 ? (t - 8.4) * .55 : 0;
  // marka anında ışıltı
  bloom.strength = .6 + sm(4, 6, t) * .1 - sm(16.3, 17.5, t) * .2;
}

function renderAt(t) { update(t); composer.render(); overlay(t); }
window.renderFrame = i => renderAt(i / FPS);
window.renderAt = renderAt;

/* ---------------- oynatma ---------------- */
const params = new URLSearchParams(location.search);
await document.fonts.load('300 64px "Inter Display"'); await document.fonts.load('200 64px "Inter Display"');
renderAt(params.has('t') ? +params.get('t') : 0);
window.READY = true;
if (params.has('play')) {
  const btn = document.getElementById('play'); btn.style.display = 'block';
  btn.onclick = () => {
    btn.remove();
    const au = new Audio('output/muzik.wav'); au.play().catch(() => {});
    const t0 = performance.now();
    const loop = () => { const t = au.currentTime > 0 ? au.currentTime : (performance.now() - t0) / 1000; renderAt(Math.min(t, DUR)); if (t < DUR) requestAnimationFrame(loop); };
    loop();
  };
}
</script>
